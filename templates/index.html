<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartStock - Inventory Management</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-content">
            <div>
                <h1>SmartStock</h1>
                <p>Inventory & Product Management System</p>
            </div>
        </div>
    </header>


    <main>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Total Stock</h3>
                <p id="totalStock">0</p>
            </div>

            <div class="card">
                <h3>Low Stock</h3>
                <p id="lowStock">0</p>
            </div>

            <div class="card">
                <h3>Inventory Value</h3>
                <p id="inventoryValue">₹0</p>
            </div>

        </section>


        <!-- Add Product -->
        <section class="section-box">

            <h2>Add New Product</h2>

            <form id="productForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Product Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter product name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Category</label>
                        <input
                            type="text"
                            id="category"
                            placeholder="Enter category"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Quantity</label>
                        <input
                            type="number"
                            id="quantity"
                            placeholder="Enter quantity"
                            min="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Price</label>
                        <input
                            type="number"
                            id="price"
                            placeholder="Enter price"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                </div>


                <button type="submit" class="add-btn">
                    + Add Product
                </button>

                <p id="message"></p>

            </form>

        </section>


        <!-- Product List -->
        <section class="section-box">

            <div class="product-header">

                <div>
                    <h2>Product Inventory</h2>
                    <p>Manage your products and stock</p>
                </div>

                <button
                    onclick="loadProducts()"
                    class="view-btn"
                >
                    View Products
                </button>

            </div>


            <!-- Search -->
            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search product..."
                    onkeyup="searchProducts()"
                >

            </div>


            <!-- Product Table -->
            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Stock Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productTable"></tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>
        <p>SmartStock &copy; 2026 | Inventory Management System</p>
    </footer>


    <script src="/static/script.js"></script>

</body>

</html>
